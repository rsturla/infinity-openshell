[package]
name = "infinity-openshell-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Test harness for the Infinity OpenShell RAP server"
keywords = ["infinity", "openshell", "rap", "testing"]
categories = ["development-tools", "testing"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
infinity-openshell = { path = "../infinity-openshell" }
openshell-session = { path = "../openshell-session", features = ["testkit"] }
rap-protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
