# Example create-time sandbox policy.
#
# It grants read-only HTTPS to example.com for curl, and denies everything
# else. The filesystem paths are required because a policy with network rules
# replaces the restrictive default policy.
#
#   cargo run --features cli --bin infinity-openshell -- serve \
#     --gateway demo --image curlimages/curl:8.10.1 \
#     --policy examples/policies/example.yaml

version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /bin, /proc, /dev/urandom, /var/log]
  read_write: [/tmp, /dev/null]
network_policies:
  example_https:
    endpoints:
      - host: example.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/bin/curl
